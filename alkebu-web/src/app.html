<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Modern Fonts - Inter (body), Outfit (display), Lora (serif) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap"
			media="print"
			onload="this.media='all'"
		>
		<!-- Template / icon CSS (deferred to avoid render-blocking) -->
		<link rel="stylesheet" href="/assets/css/fontawesome-all.min.css" media="print" onload="this.media='all'">
		<link rel="stylesheet" href="/assets/css/style.css" media="print" onload="this.media='all'">
		<link rel="stylesheet" href="/assets/css/responsive.css" media="print" onload="this.media='all'">
		<noscript>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap">
			<link rel="stylesheet" href="/assets/css/fontawesome-all.min.css">
			<link rel="stylesheet" href="/assets/css/style.css">
			<link rel="stylesheet" href="/assets/css/responsive.css">
		</noscript>

		%sveltekit.head%

		<!-- Rybbit analytics (self-hosted, privacy-focused) -->
		<script
			src="https://stats.alkebu.link/api/script.js"
			data-site-id="c4433545969c"
			defer
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
